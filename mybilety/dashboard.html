<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Master — Панель управления</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="logo">JS Master</div>
            <div class="user-info">
                <span class="user-name" id="userName">Пользователь</span>
                <button id="logoutBtn" class="logout-btn">Выйти</button>
            </div>
        </div>

        <!-- Ссылка на книгу на GitHub -->
        <div class="book-link">
            <a href="https://github.com/azat-io/you-dont-know-js-ru" target="_blank">
                Книга "You Don't Know JS" на русском
            </a>
            <p style="margin-top: 10px; font-size: 14px; color: #666;">
                Изучите JavaScript глубже с помощью этой бесплатной книги
            </p>
        </div>

        <!-- Режимы тестирования -->
        <div class="modes-section">
            <h2 class="modes-title">Выберите режим тестирования</h2>
            <div class="modes-buttons">
                <button id="randomMode" class="mode-btn">20 случайных вопросов</button>
                <button id="fullMode" class="mode-btn">Все вопросы (база)</button>
                <button id="topicMode" class="mode-btn">20 вопросов по теме</button>
            </div>
            
            <div id="topicSelect" class="topic-select">
                <label>Выберите тему:</label>
                <select id="selectedTopic">
                    <option value="">-- Выберите тему --</option>
                </select>
            </div>
            
            <button id="startTestBtn" class="btn-primary" style="margin-top: 20px;">Начать тест</button>
        </div>

        <!-- Таблица рейтинга -->
        <div class="rating-section">
            <h2 class="modes-title">Таблица рейтинга</h2>
            <div class="rating-tabs">
                <button class="rating-tab active" data-category="personal_by_percent">Личный (по проценту)</button>
                <button class="rating-tab" data-category="personal_by_speed">Личный (по скорости)</button>
                <button class="rating-tab" data-category="global_by_percent">Глобальный (по проценту)</button>
                <button class="rating-tab" data-category="global_by_speed">Глобальный (по скорости)</button>
            </div>
            <div class="rating-table">
                <table>
                    <thead>
                        <tr>
                            <th>Место</th>
                            <th>Пользователь</th>
                            <th>Результат</th>
                            <th>Процент</th>
                            <th>Время</th>
                            <th>Режим</th>
                        </tr>
                    </thead>
                    <tbody id="ratingBody">
                        <tr><td colspan="6" class="empty-rating">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="js/utils.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
