<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Master — Тестирование</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="test-container">
        <div class="test-card">
            <div class="test-header">
                <span class="progress">Вопрос <span id="current">1</span> из <span id="total">20</span></span>
                <button id="finishBtn" class="test-btn">Завершить досрочно</button>
            </div>
            
            <div class="question-text" id="questionText"></div>
            
            <div class="options-list" id="optionsList"></div>
            
            <div class="test-footer">
                <button id="prevBtn" class="test-btn">Назад</button>
                <button id="nextBtn" class="test-btn">Далее</button>
            </div>
        </div>
        <a href="dashboard.html" class="back-link">Вернуться в панель</a>
    </div>
    
    <script src="js/utils.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/test.js"></script>
</body>
</html>
